<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BobaBot — Order</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>BobaBot</h1>
  <p class="subtitle">Boba that learns from your ratings.</p>
  <p class="order-count" id="order-count">&nbsp;</p>
  <p class="my-cups" id="my-cups" hidden></p>

  <div id="offline" class="machine-offline" hidden>Machine is offline — hang tight.</div>

  <form id="order-form" class="card">
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="20" placeholder="e.g. Michael" required>

    <label>How much drink? <small class="label-note">(liquid oz)</small></label>
    <div class="segmented" id="sizes"></div>

    <label class="checkbox-row">
      <input id="tapioca" type="checkbox" checked> Tapioca pearls
    </label>

    <button type="submit" data-mode="ml">🤖 Order now</button>
    <p class="hint" id="ml-hint">The robot picks your mix from everyone's ratings.</p>

    <button type="button" id="picky-toggle" class="secondary">I'm picky</button>
    <div id="picky" hidden>
      <div id="knobs"></div>
      <button type="submit" data-mode="picky">Place my order</button>
      <p class="hint">Picky cups still help: your rating teaches the robot too.</p>
    </div>
  </form>

  <p class="subtitle" style="text-align:center">
    Already ordered? <a href="/queue">check your place in line</a><br>
    <a href="/leaderboard">🏆 Leaderboard</a>
  </p>
</main>

<script type="module">
import {
  ORDERS, MACHINE_STATE, SIZES_OZ, DEFAULT_OZ, ozToMl, addDoc, onSnapshot, serverTimestamp, saveOrderId,
  machineOnline, loadModel, countOrders, loadCupCounts, resolveDrinker, getDrinkerId, getSavedName, saveName
} from "/app.js";
import { KNOBS, learn, forDrinker, pickRecipe } from "/ml.js";

const drinkerId = getDrinkerId();
// Who this phone counts as, if the dev merged it into another phone.
const meReady = resolveDrinker(drinkerId).catch(() => drinkerId);
document.getElementById("name").value = getSavedName();

const sizes = document.getElementById("sizes");
for (const oz of SIZES_OZ) {
  sizes.insertAdjacentHTML("beforeend", `
    <label><input type="radio" name="size" value="${oz}" ${oz === DEFAULT_OZ ? "checked" : ""}>
      <span>${oz} oz<small>${ozToMl(oz)} ml</small></span></label>`);
}

const knobs = document.getElementById("knobs");
for (const k of KNOBS) {
  knobs.insertAdjacentHTML("beforeend", `
    <label for="knob-${k.key}">${k.label} <span class="slider-val" id="knob-${k.key}-val"></span></label>
    <div class="slider-row"><input id="knob-${k.key}" type="range" min="0" max="100" value="${k.default}"></div>`);
  const el = document.getElementById(`knob-${k.key}`);
  const val = document.getElementById(`knob-${k.key}-val`);
  const show = () => val.textContent = k.describe(Number(el.value));
  el.addEventListener("input", show); show();
}

document.getElementById("picky-toggle").addEventListener("click", () => {
  const panel = document.getElementById("picky");
  panel.hidden = !panel.hidden;
});

Promise.all([loadCupCounts(), meReady])
  .then(([people, myId]) => {
    const rank = people.findIndex((p) => p.id === myId);
    if (rank < 0) return;
    const me = people[rank];
    const el = document.getElementById("my-cups");
    el.textContent = `You've had ${me.cups} ${me.cups === 1 ? "cup" : "cups"} · #${rank + 1} on the leaderboard`;
    el.hidden = false;
  })
  .catch(() => {});

countOrders()
  .then((n) => document.getElementById("order-count").textContent =
    `🧋 ${n} ${n === 1 ? "cup" : "cups"} ordered so far`)
  .catch(() => {});

// Learn from all ratings once on load; fall back to the default recipe.
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const modelReady = loadModel()
  .catch((err) => { console.warn(err); return learn([]); })
  .then(async (m) => forDrinker(m, await meReady));
modelReady.then((m) => {
  const hint = document.getElementById("ml-hint");
  // Never reveal the recipe: "Order now" cups are meant to be a mystery.
  if (m.nMine) hint.textContent =
    `The robot has learned from your ${plural(m.nMine, "rating")}. What will it make you this time?`;
  else if (m.n) hint.textContent =
    `The robot starts from the group's taste (${plural(m.n, "rating")} so far), then learns yours as you rate.`;
});

onSnapshot(MACHINE_STATE, (snap) => {
  document.getElementById("offline").hidden = machineOnline(snap.data());
});

document.getElementById("order-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mode = e.submitter?.dataset.mode || "ml";
  const btn = e.submitter;
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "Placing…"; }
  try {
    const sizeOz = Number(document.querySelector("input[name=size]:checked").value);
    let mix, model = null;
    if (mode === "ml") {
      const m = await modelReady;
      mix = pickRecipe(m);
      model = { n: m.n, n_mine: m.nMine, best: m.best, predicted: m.predicted };
    } else {
      mix = Object.fromEntries(KNOBS.map((k) =>
        [k.key, Number(document.getElementById(`knob-${k.key}`).value)]));
    }
    const name = document.getElementById("name").value.trim() || "Someone";
    saveName(name);
    const ref = await addDoc(ORDERS, {
      name,
      drinker_id: drinkerId,
      mode,
      size_oz: sizeOz,
      recipe: { ...mix, volume_ml: ozToMl(sizeOz), tapioca: document.getElementById("tapioca").checked },
      model,
      status: "queued",
      created_at: serverTimestamp(),
      rating: null
    });
    saveOrderId(ref.id);
    location.href = "/queue";
  } catch (err) {
    alert("Could not place order: " + err.message);
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
});
</script>
</body>
</html>
