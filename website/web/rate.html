<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BobaBot — Rate</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>How was it?</h1>
  <p class="subtitle">Your rating trains the recipe.</p>

  <p id="water-note" class="water-note" hidden></p>

  <div class="card">
    <div class="stars" id="stars">
      <button data-v="1">★</button><button data-v="2">★</button>
      <button data-v="3">★</button><button data-v="4">★</button>
      <button data-v="5">★</button>
    </div>
    <div id="directions"></div>
    <button id="submit" disabled>Submit rating</button>
    <p id="thanks" class="subtitle" style="text-align:center;margin-top:12px" hidden>
      Thanks! <a href="/">Order again</a>
    </p>
  </div>
</main>

<script type="module">
import { doc, getDoc, updateDoc, db, MACHINE_STATE } from "/app.js";
import { KNOBS } from "/ml.js";

const id = location.pathname.split("/").pop();

// Until the machine has a water pump, it pours only the tea and creamer and
// the guest adds the water. Shown only now, after pouring, so "Order now"
// cups stay a mystery until they're in your hand.
Promise.all([getDoc(doc(db, "orders", id)), getDoc(MACHINE_STATE)]).then(([order, machine]) => {
  const o = order.data();
  const r = o?.recipe;
  if (!r || typeof r.tea !== "number" || machine.data()?.water_pump) return;
  const waterOz = Math.round(o.size_oz * (100 - r.tea - r.creamer) / 100);
  if (waterOz < 1) return;
  const note = document.getElementById("water-note");
  note.textContent = `💧 Top it up with about ${waterOz} oz of water from the fountain, until you have ${o.size_oz} oz. ` +
    "The machine only pours tea and creamer for now.";
  note.hidden = false;
}).catch(() => {});
let chosen = 0;

// "Which way?" per knob. Optional, but it teaches the model much faster.
const feedback = {};
const directions = document.getElementById("directions");
directions.insertAdjacentHTML("beforeend", `<p class="hint">Next time I'd like…</p>`);
for (const k of KNOBS) {
  const row = document.createElement("div");
  row.className = "segmented direction";
  for (const [dir, label] of [[-1, k.less], [0, "Perfect"], [1, k.more]]) {
    row.insertAdjacentHTML("beforeend", `
      <label><input type="radio" name="dir-${k.key}" value="${dir}"><span>${label}</span></label>`);
  }
  row.addEventListener("change", (e) => feedback[k.key] = Number(e.target.value));
  directions.appendChild(row);
}
const btns = document.querySelectorAll("#stars button");
btns.forEach(b => b.addEventListener("click", () => {
  chosen = Number(b.dataset.v);
  btns.forEach(x => x.classList.toggle("active", Number(x.dataset.v) <= chosen));
  document.getElementById("submit").disabled = false;
}));

document.getElementById("submit").addEventListener("click", async () => {
  if (!chosen) return;
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const update = { rating: chosen };
    if (Object.keys(feedback).length) update.feedback = feedback;
    await updateDoc(doc(db, "orders", id), update);
    document.getElementById("thanks").hidden = false;
    btn.hidden = true;
    localStorage.removeItem("orderId");
  } catch (e) {
    alert(e.message); btn.disabled = false; btn.textContent = "Submit rating";
  }
});
</script>
</body>
</html>
