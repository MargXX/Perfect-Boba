<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BobaBot — Admin</title>
<link rel="stylesheet" href="/style.css">
<!-- Fetch every script at once rather than one import at a time (much faster on the ESP32). -->
<link rel="modulepreload" href="/app.js">
<link rel="modulepreload" href="/firebase.js">
<link rel="modulepreload" href="/ml.js">
</head>
<body>
<main>
  <h1>Admin</h1>
  <p class="order-count" id="order-count">&nbsp;</p>
  <div id="offline" class="machine-offline" hidden>Machine is offline.</div>

  <div class="card">
    <h2 style="margin-top:0">Machine</h2>
    <div id="machine-info" class="status-list"></div>
    <p class="hint">Pause, clear the queue and more on the <a href="/dev">dev page</a>.</p>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Active queue</h2>
    <ul id="active" class="order-list"></ul>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Recent completed</h2>
    <ul id="done" class="order-list"></ul>
  </div>
</main>

<script type="module">
import {
  MACHINE_STATE, ORDERS, onSnapshot, query, where, orderBy, limit, machineOnline, countOrders,
  escapeHtml, describeRecipe, renderMachineStatus
} from "/app.js";

const showCount = () => countOrders()
  .then((n) => document.getElementById("order-count").textContent = `🧋 ${n} orders so far`)
  .catch(() => {});
showCount();

let machine = {};
setInterval(() => renderMachineStatus(document.getElementById("machine-info"), machine), 5000);
onSnapshot(MACHINE_STATE, (snap) => {
  const d = machine = snap.data() || {};
  const online = machineOnline(d);
  document.getElementById("offline").hidden = online;
  renderMachineStatus(document.getElementById("machine-info"), d);
});

const active = query(
  ORDERS,
  where("status", "in", ["queued","awaiting_cup","dispensing"]),
  orderBy("created_at", "asc")
);
onSnapshot(active, (snap) => {
  const list = document.getElementById("active"); list.innerHTML = "";
  let n = 0;
  showCount();
  snap.forEach(d => {
    n++;
    const x = d.data();
    const li = document.createElement("li");
    li.innerHTML = `<span>${n}. ${escapeHtml(x.name)} — ${escapeHtml(describeRecipe(x))}</span>
                    <span class="status-pill ${x.status}">${x.status}</span>`;
    list.appendChild(li);
  });
  if (!n) list.innerHTML = "<li>Empty</li>";
});

const doneQ = query(
  ORDERS,
  where("status", "in", ["done","rated"]),
  orderBy("created_at", "desc"),
  limit(10)
);
onSnapshot(doneQ, (snap) => {
  const list = document.getElementById("done"); list.innerHTML = "";
  snap.forEach(d => {
    const x = d.data();
    const li = document.createElement("li");
    li.innerHTML = `<span>${escapeHtml(x.name)} — ${escapeHtml(describeRecipe(x))}</span>
                    <span>${x.rating ? "★".repeat(x.rating) : "unrated"}</span>`;
    list.appendChild(li);
  });
});
</script>
</body>
</html>
